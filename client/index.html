<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover so env(safe-area-inset-*) reports real values on
         notched phones; without it the insets are always zero and the padding
         that keeps the commit bar clear of the home indicator does nothing. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Turn 16 is a tactical Blood Bowl puzzle game about finding the touchdown when only one turn remains."
    />
    <title>Turn 16</title>

    <!-- Google tag (gtag.js) — init snippet lives in /gtag-init.js so the CSP
         in netlify.toml needs no 'unsafe-inline' for script-src. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WJ2Q968GC8"></script>
    <script src="/gtag-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
