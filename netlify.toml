[build]
  base    = "client"
  # generate:seed rebuilds netlify/functions/scenarioSeed.js from
  # client/src/scenarios/*.json so adding a puzzle needs no manual import
  # registration (see scripts/generate-scenario-seed.mjs).
  #
  # The functions' npm install must happen BEFORE Netlify bundles them, and the
  # bundle check then runs against the same tree the deploy will bundle — so a
  # module-resolution break fails the build command with a clear message rather
  # than surfacing as a raw esbuild error in the bundling stage.
  command = "npm install && npm run generate:seed && npm run build && cd ../netlify/functions && npm install && node ../../scripts/check-function-bundles.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "../netlify/functions"
  node_bundler = "esbuild"

# Route API calls to the leaderboard function
# The function reads scenarioId from the path segment
[[redirects]]
  from   = "/api/leaderboard/*"
  to     = "/.netlify/functions/leaderboard/:splat"
  status = 200

# Route series leaderboard calls to the series-leaderboard function
[[redirects]]
  from   = "/api/series-leaderboard"
  to     = "/.netlify/functions/series-leaderboard"
  status = 200

# Combined home-screen progress (all scenario boards + the series board) in one
# request, instead of one fetch per scenario.
[[redirects]]
  from   = "/api/progress"
  to     = "/.netlify/functions/progress"
  status = 200

# Player issue and feature reports — GitHub credential remains server-side.
[[redirects]]
  from   = "/api/reports"
  to     = "/.netlify/functions/reports"
  status = 200

# Player contact messages — the Resend credential and destination inbox
# remain server-side.
[[redirects]]
  from   = "/api/contact"
  to     = "/.netlify/functions/contact"
  status = 200

# Anonymous first-party engagement batches. The admin read remains separately
# authenticated below.
[[redirects]]
  from   = "/api/analytics"
  to     = "/.netlify/functions/analytics"
  status = 200

# Route puzzle editor calls to the editor functions (Netlify Blobs drafts —
# see README "Puzzle Editor on Netlify" for the publish workflow). Every
# /api/editor/* route, including GET, requires an allowlisted admin.
[[redirects]]
  from   = "/api/editor/statistics"
  to     = "/.netlify/functions/editor-statistics"
  status = 200

[[redirects]]
  from   = "/api/editor/analytics"
  to     = "/.netlify/functions/editor-analytics"
  status = 200

[[redirects]]
  from   = "/api/editor/admins"
  to     = "/.netlify/functions/editor-admins"
  status = 200

[[redirects]]
  from   = "/api/editor/scenarios"
  to     = "/.netlify/functions/editor-scenarios"
  status = 200

[[redirects]]
  from   = "/api/editor/scenarios/*"
  to     = "/.netlify/functions/editor-scenarios/:splat"
  status = 200

[[redirects]]
  from   = "/api/editor/series/default"
  to     = "/.netlify/functions/editor-series"
  status = 200

[[redirects]]
  from   = "/api/editor/publish"
  to     = "/.netlify/functions/editor-publish"
  status = 200

# Public read-only endpoint — the deployed game client fetches the published
# scenario/series set from here instead of the build-time bundle.
[[redirects]]
  from   = "/api/scenarios"
  to     = "/.netlify/functions/scenarios"
  status = 200

# SPA fallback — all other routes serve index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security headers ────────────────────────────────────────────────────────
# The CSP allowlist covers exactly what the app loads: the Google Identity
# Services script and its iframe/endpoints, the Google Analytics (gtag.js) tag
# and its collection endpoints, plus Google avatar images on the leaderboards.
# Nothing else is permitted, so an injected script has nowhere to exfiltrate the
# cached ID token to.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Content-Security-Policy = """
      default-src 'self'; \
      script-src 'self' https://accounts.google.com/gsi/client https://www.googletagmanager.com; \
      style-src 'self' 'unsafe-inline'; \
      img-src 'self' data: https://lh3.googleusercontent.com https://*.googleusercontent.com https://www.google-analytics.com https://*.google-analytics.com; \
      font-src 'self'; \
      connect-src 'self' https://accounts.google.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; \
      frame-src https://accounts.google.com; \
      frame-ancestors 'none'; \
      base-uri 'self'; \
      form-action 'self'; \
      object-src 'none'"""

# Hashed build assets are immutable; index.html must never be cached so a
# deploy is picked up on the next load.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
